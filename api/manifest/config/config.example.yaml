# Copy this file to config.yaml before local development. The real file is
# ignored because it contains environment-specific hosts and credentials.
server:
  address: "127.0.0.1:8090"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
logger:
  level: "info"
  stdout: true
database:
  default:
    type: "pgsql"
    host: "127.0.0.1"
    port: "5432"
    user: "postgres"
    pass: "postgres"
    name: "nav"

nav:
  siteSlug: "nav-local"
  brand: "月离导航"
  authorization:
    bootstrapAdministratorSubs:
      - "usr_AAAAAAAAAAAAAAAAAAAAAA"
  jwks:
    url: "http://localhost:8081/oauth2/jwks.json"
    issuer: "http://localhost:8081"
    audience: ""
    allowLoopbackHttp: true # local development only
